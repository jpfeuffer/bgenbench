name: bgenbench

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config zlib1g-dev libzstd-dev libsqlite3-dev curl unzip git

      # ── Cache: built BGEN libraries ──────────────────────────────────────
      - name: Restore cached BGEN libraries
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
            build
            .venv
          key: ${{ runner.os }}-bgen-libs-O3-${{ hashFiles('scripts/build_libraries.sh') }}

      # ── Cache: plink2 binary ─────────────────────────────────────────────
      - name: Restore cached plink2
        id: cache-plink2
        uses: actions/cache/restore@v4
        with:
          path: tools/plink2
          key: ${{ runner.os }}-plink2-20260504

      # ── Cache: large benchmark dataset ───────────────────────────────────
      - name: Restore cached benchmark dataset
        id: cache-data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ${{ runner.os }}-bgen-data-${{ hashFiles('scripts/prepare_large_bgen.sh') }}

      - name: Run benchmark
        env:
          BGENBENCH_CFLAGS: "-O3 -DNDEBUG -fPIC"
          BGENBENCH_CXXFLAGS: "-O3 -DNDEBUG -fPIC"
          BGENBENCH_FULL_LOAD_MAX_VARIANTS: "2000"
          BGENBENCH_MIN_BGEN_BYTES: "1000000000"
        run: |
          chmod +x scripts/*.sh
          scripts/run_benchmarks.sh

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bgenbench-report
          path: |
            outputs/report.html
            outputs/results.json

      # ── Save caches (always, even if benchmark failed) ───────────────────
      - name: Save BGEN libraries cache
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
            build
            .venv
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save plink2 cache
        if: always() && steps.cache-plink2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/plink2
          key: ${{ steps.cache-plink2.outputs.cache-primary-key }}

      - name: Save benchmark dataset cache
        if: always() && steps.cache-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: ${{ steps.cache-data.outputs.cache-primary-key }}
